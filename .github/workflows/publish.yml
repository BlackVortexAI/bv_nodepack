name: Publish to Comfy registry

# Publishes only a commit whose Validate run succeeded on a push to main of this
# repository, and only when pyproject.toml names a version the Registry does not have
# yet. There is no manual trigger: to publish again, re-run the Validate workflow for
# the commit. Every step runs with read-only repository permissions; the Registry
# token reaches the publish step alone.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions: {}

env:
  COMFY_CLI_VERSION: "1.20.0"
  NODE_ID: bv_nodepack

jobs:
  publish-node:
    name: BV-NodePack
    runs-on: ubuntu-latest
    # Provenance: the validated run must come from a push to main of this very
    # repository (never a fork or a pull request) and must have succeeded.
    if: >-
      github.repository_owner == 'BlackVortexAI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Decide whether this commit introduces a new version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published="$(curl -fsS "https://api.comfy.org/nodes/${NODE_ID}/versions" | python3 -c 'import json,sys; print("\n".join(v["version"] for v in json.load(sys.stdin)))')"
          if printf '%s\n' "$published" | grep -qx "$version"; then
            echo "Version $version is already on the Registry; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the pinned comfy-cli
        if: steps.version.outputs.publish == 'true'
        run: python -m pip install "comfy-cli==${COMFY_CLI_VERSION}" "pathspec>=0.12,<1"

      - name: Write the package manifest and refuse unexpected files
        if: steps.version.outputs.publish == 'true'
        run: python .github/scripts/registry_manifest.py --write "manifest-${{ steps.version.outputs.version }}.json"

      - name: Publish to the Registry
        if: steps.version.outputs.publish == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

      - name: Compare the uploaded archive with the manifest
        if: steps.version.outputs.publish == 'true'
        run: python .github/scripts/registry_manifest.py --compare-cdn "${{ steps.version.outputs.version }}" --manifest "manifest-${{ steps.version.outputs.version }}.json" --report "cdn-comparison-${{ steps.version.outputs.version }}.json"

      - name: Keep the manifest and the comparison as run artifacts
        if: always() && steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-manifest-${{ steps.version.outputs.version }}
          path: |
            manifest-${{ steps.version.outputs.version }}.json
            cdn-comparison-${{ steps.version.outputs.version }}.json
          if-no-files-found: warn
