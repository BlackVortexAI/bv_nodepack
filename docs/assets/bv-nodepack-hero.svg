<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">BV Node Pack for ComfyUI</title>
  <desc id="desc">A dark ComfyUI-inspired workflow showing regional prompting, structured prompts, smart pipes and subgraph controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#151c26"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#269ee8"/><stop offset="1" stop-color="#7667f5"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="640" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="34" fill="url(#grid)"/>
  <circle cx="1360" cy="80" r="260" fill="#269ee8" opacity=".08"/>
  <circle cx="180" cy="590" r="300" fill="#7667f5" opacity=".08"/>

