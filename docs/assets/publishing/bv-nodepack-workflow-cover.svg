<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1755" viewBox="0 0 1200 1755" role="img" aria-labelledby="title desc">
  <title id="title">BV Node Pack Regional Workflows</title>
  <desc id="desc">A portrait cover for BV Node Pack workflow releases on Civitai.</desc>
  <defs>
