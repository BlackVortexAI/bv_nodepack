<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720" role="img" aria-labelledby="title desc">
  <title id="title">BV Node Pack for ComfyUI</title>
  <desc id="desc">A dark 21:9 banner presenting BV Node Pack and its regional prompting editor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090d12"/>
      <stop offset=".55" stop-color="#111822"/>
      <stop offset="1" stop-color="#182334"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2ca7ee"/>
      <stop offset="1" stop-color="#7567f5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#46b6ff"/>
      <stop offset="1" stop-color="#4c78a8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="editorClip"><rect x="790" y="100" width="800" height="520" rx="24"/></clipPath>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <rect width="1680" height="720" fill="url(#grid)"/>
  <circle cx="250" cy="630" r="340" fill="#7567f5" opacity=".09" filter="url(#glow)"/>
  <circle cx="1510" cy="60" r="300" fill="#2ca7ee" opacity=".12" filter="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(92 110)">
      <path d="M24 12C5 31 9 61 29 74C49 88 78 78 86 56C94 34 79 17 61 18C43 19 31 35 34 50C37 66 55 72 67 63C79 54 75 38 64 34C53 30 45 38 46 47C47 55 56 57 60 51"
            transform="scale(.92)" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="47" fill="#fff" font-size="58" font-weight="760">BV Node Pack</text>
      <text x="122" y="88" fill="#aab9ca" font-size="24" letter-spacing=".3">Advanced workflow tools for ComfyUI</text>
    </g>

    <g transform="translate(94 280)">
      <text fill="#fff" font-size="43" font-weight="700">
        <tspan x="0" y="0">Design prompts spatially.</tspan>
        <tspan x="0" y="56">Keep workflows modular.</tspan>
      </text>
      <text x="2" y="152" fill="#aebdcd" font-size="24">Regional prompting, structured prompts,</text>
      <text x="2" y="188" fill="#aebdcd" font-size="24">Smart Pipes and subgraph-aware controls.</text>

      <g transform="translate(0 244)" font-size="19" font-weight="650">
        <rect width="190" height="50" rx="25" fill="#1c2c3b" stroke="#2ca7ee" stroke-opacity=".7"/>
        <text x="95" y="32" text-anchor="middle" fill="#c8eaff">Regional Editor</text>
        <rect x="208" width="164" height="50" rx="25" fill="#26243b" stroke="#7567f5" stroke-opacity=".8"/>
        <text x="290" y="32" text-anchor="middle" fill="#ded9ff">Prompt AST</text>
        <rect x="390" width="160" height="50" rx="25" fill="#1c2c3b" stroke="#64dc85" stroke-opacity=".7"/>
        <text x="470" y="32" text-anchor="middle" fill="#d2ffe0">Smart Pipes</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="790" y="100" width="800" height="520" rx="24" fill="#13181f" stroke="#3b4858" stroke-width="2"/>
      <g clip-path="url(#editorClip)">
        <rect x="790" y="100" width="800" height="58" fill="#202730"/>
        <circle cx="824" cy="129" r="7" fill="#2ca7ee"/>
        <text x="845" y="137" fill="#fff" font-size="22" font-weight="700">BV Regional Editor</text>
        <rect x="1378" y="115" width="92" height="30" rx="6" fill="#151b22" stroke="#465464"/>
        <text x="1424" y="136" fill="#c7d3df" font-size="14" text-anchor="middle">Workspace</text>

        <rect x="790" y="158" width="188" height="462" fill="#101419"/>
        <text x="816" y="196" fill="#8fa0b2" font-size="15" font-weight="700">REGIONS</text>
        <rect x="808" y="216" width="150" height="67" rx="8" fill="#19232d" stroke="#4c78a8"/>
        <circle cx="826" cy="237" r="7" fill="#4c78a8"/><text x="842" y="243" fill="#e7eef6" font-size="16">Cyan subject</text>
        <rect x="808" y="297" width="150" height="67" rx="8" fill="#2a2023" stroke="#e45756"/>
        <circle cx="826" cy="318" r="7" fill="#e45756"/><text x="842" y="324" fill="#e7eef6" font-size="16">Amber subject</text>
        <rect x="808" y="378" width="150" height="67" rx="8" fill="#17271d" stroke="#59b957"/>
        <circle cx="826" cy="399" r="7" fill="#59b957"/><text x="842" y="405" fill="#e7eef6" font-size="16">Light arc</text>

        <rect x="978" y="158" width="422" height="462" fill="#0b0f14"/>
        <rect x="1023" y="204" width="332" height="370" rx="7" fill="#252d36"/>
        <rect x="1045" y="230" width="151" height="316" fill="#4c78a8" opacity=".67"/>
        <rect x="1184" y="230" width="149" height="316" fill="#e45756" opacity=".62"/>
        <rect x="1162" y="330" width="56" height="116" fill="#9f70a0" opacity=".82"/>
        <path d="M1041 270C1124 203 1251 210 1337 279" fill="none" stroke="#59b957" stroke-width="26" stroke-linecap="round" opacity=".7"/>
        <rect x="1001" y="177" width="34" height="164" rx="14" fill="#171d24" stroke="#425061"/>
        <circle cx="1018" cy="201" r="11" fill="#2ca7ee"/>
        <rect x="1009" y="230" width="18" height="18" rx="2" fill="none" stroke="#dbe7f2" stroke-width="2"/>
        <path d="M1009 271l18-10M1009 277l18-10" stroke="#dbe7f2" stroke-width="2"/>

        <rect x="1400" y="158" width="190" height="462" fill="#101419"/>
        <text x="1422" y="196" fill="#8fa0b2" font-size="15" font-weight="700">REGION PROMPT</text>
        <text x="1422" y="230" fill="#cbd6e1" font-size="14">Strength</text>
        <rect x="1422" y="241" width="144" height="34" rx="6" fill="#171d24" stroke="#384655"/>
        <text x="1434" y="264" fill="#fff" font-size="15">0.85</text>
        <text x="1422" y="312" fill="#cbd6e1" font-size="14">Positive</text>
        <rect x="1422" y="324" width="144" height="112" rx="6" fill="#171d24" stroke="#384655"/>
        <path d="M1436 346h102M1436 363h116M1436 380h94M1436 397h110" stroke="#8292a4" stroke-width="4" stroke-linecap="round" opacity=".7"/>
        <text x="1422" y="475" fill="#cbd6e1" font-size="14">Negative</text>
        <rect x="1422" y="487" width="144" height="75" rx="6" fill="#171d24" stroke="#384655"/>
        <path d="M1436 509h111M1436 526h87" stroke="#8292a4" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      </g>
    </g>

    <path d="M720 360C750 360 758 360 790 360" fill="none" stroke="url(#cyan)" stroke-width="5" opacity=".9"/>
    <circle cx="720" cy="360" r="7" fill="#64dc85"/>
    <circle cx="790" cy="360" r="7" fill="#64dc85"/>
  </g>
</svg>
